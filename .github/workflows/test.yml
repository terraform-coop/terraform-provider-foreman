name: Test
on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '**.go'
      - '.github/workflows/*.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build -v .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v1.64.8

  test:
    strategy:
      matrix:
        opentofu: ['1.9.*', '1.10.*']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.opentofu }}
          tofu_wrapper: false
      - run: go test -race -count=1 -coverprofile=coverage.out ./internal/... ./generated/...
      # Coverage gate is intentionally low while the rewrite's test suite is
      # being built back up. Raise this threshold as tests are added.
      - run: "go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%' | awk '{exit ($1 >= 5.0) ? 0 : 1}'"

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go generate ./...
      - run: git diff --compact-summary --exit-code

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Start Foreman
        run: docker compose up -d
      - name: Wait for Foreman
        run: |
          echo "Waiting for Foreman to be ready..."
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null \
              -u admin:changeme \
              "http://localhost:3000/api/v2/status" 2>/dev/null; then
              echo "Foreman is ready"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 10
          done
          echo "Foreman did not become ready in 600s"
          docker compose logs foreman
          exit 1
      - name: Run integration tests
        run: go test -v -tags=integration -count=1 -timeout=300s -race ./internal/provider/...
        env:
          FOREMAN_SERVER_HOSTNAME: localhost:3000
          FOREMAN_CLIENT_USERNAME: admin
          FOREMAN_CLIENT_PASSWORD: changeme
          FOREMAN_CLIENT_TLS_INSECURE: "true"
          FOREMAN_CLIENT_SCHEME: http
      - name: Tear down
        if: always()
        run: docker compose down -v
